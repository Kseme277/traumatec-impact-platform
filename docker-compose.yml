services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tip}
      POSTGRES_USER: ${POSTGRES_USER:-tip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tip}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tip} -d ${POSTGRES_DB:-tip}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - postgres-exporter
      - redis-exporter
      - minio
      - cadvisor

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tip}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8089}:8080"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-tip_grafana}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tip-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:-tip}@postgres:5432/${POSTGRES_DB:-tip}
      DB_SCHEMA: identity
      SERVICE_NAME: identity
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NOM: ${BOOTSTRAP_ADMIN_NOM:-}
      BOOTSTRAP_ADMIN_PRENOM: ${BOOTSTRAP_ADMIN_PRENOM:-}
      BOOTSTRAP_ADMIN_CLERK_ID: ${BOOTSTRAP_ADMIN_CLERK_ID:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@traumatec.org}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Traumatec Impact Platform}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
    volumes:
      - ./services/identity/app:/app/app
      - ./packages/tip-common/tip_common:/packages/tip-common/tip_common
    ports:
      - "${IDENTITY_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  events:
    build:
      context: .
      dockerfile: services/events/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:-tip}@postgres:5432/${POSTGRES_DB:-tip}
      DB_SCHEMA: events
      SERVICE_NAME: events
      IDENTITY_SERVICE_URL: http://identity:8001
      CATALOG_SERVICE_URL: http://catalog:8003
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tip-documents}
    volumes:
      - ./services/events/app:/app/app
      - ./packages/tip-common/tip_common:/packages/tip-common/tip_common
    ports:
      - "${EVENTS_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      minio:
        condition: service_started

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:-tip}@postgres:5432/${POSTGRES_DB:-tip}
      DB_SCHEMA: catalog
      SERVICE_NAME: catalog
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tip-documents}
    volumes:
      - ./services/catalog/app:/app/app
      - ./packages/tip-common/tip_common:/packages/tip-common/tip_common
    ports:
      - "${CATALOG_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  docgen:
    build:
      context: .
      dockerfile: services/docgen/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:-tip}@postgres:5432/${POSTGRES_DB:-tip}
      DB_SCHEMA: docgen
      SERVICE_NAME: docgen
      REDIS_URL: redis://redis:6379/0
      EVENTS_SERVICE_URL: http://events:8002
      CATALOG_SERVICE_URL: http://catalog:8003
      IDENTITY_SERVICE_URL: http://identity:8001
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tip-documents}
    volumes:
      - ./services/docgen/app:/app/app
      - ./packages/tip-common/tip_common:/packages/tip-common/tip_common
    ports:
      - "${DOCGEN_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      events:
        condition: service_started
      catalog:
        condition: service_started

  docgen-worker:
    build:
      context: .
      dockerfile: services/docgen/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:-tip}@postgres:5432/${POSTGRES_DB:-tip}
      DB_SCHEMA: docgen
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: docgen
      EVENTS_SERVICE_URL: http://events:8002
      CATALOG_SERVICE_URL: http://catalog:8003
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tip-documents}
    volumes:
      - ./services/docgen/app:/app/app
      - ./packages/tip-common/tip_common:/packages/tip-common/tip_common
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      docgen:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      VITE_API_BASE_URL: /api
      VITE_GUIDES_URL: ${VITE_GUIDES_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity
      - events
      - catalog
      - docgen
      - frontend

volumes:
  pgdata:
  minio_data:
  prometheus_data:
  grafana_data:
