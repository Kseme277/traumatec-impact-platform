[project]
name = "tip-common"
version = "0.1.0"
description = "Bibliothèque partagée TIP — auth, config, factory FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "boto3>=1.35.0,<2.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0",
    "PyJWT[crypto]>=2.9.0,<3.0",
    "cryptography>=43.0.0,<49.0",
    "redis>=5.2.0,<6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tip_common*"]
