<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Un instant… | Traumatec</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#465fff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #465fff;
        --bg: #101828;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--accent);
        font-family: Outfit, system-ui, sans-serif;
        font-weight: 100;
        margin: 40px 50px;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      h1 {
        margin: 0 0 2.5rem;
        color: var(--accent);
        font-family: Outfit, system-ui, sans-serif;
        font-weight: 100;
        font-size: 3em;
        line-height: 1.15;
      }

      .slider {
        position: relative;
        width: min(400px, 88vw);
        height: 2px;
        margin: -30px auto 2.5rem;
      }

      .line {
        position: absolute;
        inset: 0;
        background: var(--accent);
        height: 2px;
      }

      .break {
        position: absolute;
        top: 0;
        background: var(--bg);
        width: 6px;
        height: 2px;
        animation: loading 2s infinite;
      }

      .dot2 {
        animation-delay: 0.5s;
      }

      .dot3 {
        animation-delay: 1s;
      }

      @keyframes loading {
        from {
          left: 0;
        }
        to {
          left: 100%;
        }
      }

      .message {
        margin: 0;
        max-width: 28rem;
        font-size: 1rem;
        line-height: 1.7;
        font-weight: 100;
        color: var(--accent);
      }

      .message.is-error {
        color: #f04438;
      }

      .message a {
        color: var(--accent);
        font-weight: 400;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 id="title">Un instant…</h1>

      <div class="slider" id="slider" aria-hidden="true">
        <div class="line"></div>
        <div class="break dot1"></div>
        <div class="break dot2"></div>
        <div class="break dot3"></div>
      </div>

      <p class="message" id="status" role="status" aria-live="polite">
        Redirection vers votre espace administrateur GuideHub…
      </p>
    </main>

    <script>
      (function () {
        var DEFAULT_API_GATEWAY = "https://guidehub.hopto.org";
        var DEFAULT_COMPANY_SLUG = "traumatec-cm";

        var params = new URLSearchParams(location.search);
        var ticket = null;
        try {
          ticket = sessionStorage.getItem("tip:guides:handoff:ticket");
        } catch (e) {
          /* ignore */
        }
        if (!ticket) {
          ticket = params.get("ticket");
        }
        var companySlug = "traumatec-cm";
        try {
          companySlug =
            sessionStorage.getItem("tip:guides:handoff:company_slug") ||
            params.get("company_slug") ||
            companySlug;
        } catch (e) {
          companySlug = params.get("company_slug") || companySlug;
        }
        var guidesWeb = location.origin.replace(/\/$/, "");
        var ghApi = guidesWeb + "/gh/api/v1";
        var manualTarget = guidesWeb + "/gh/admin";

        var title = document.getElementById("title");
        var status = document.getElementById("status");
        var slider = document.getElementById("slider");

        function setManualLink(href, label) {
          status.innerHTML =
            label +
            ' Pas de redirection ? <a href="' +
            href +
            '">Cliquez ici.</a>';
        }

        function showError(message) {
          title.textContent = "Connexion impossible";
          slider.hidden = true;
          status.classList.add("is-error");
          status.textContent = message;
        }

        if (!ticket) {
          showError(
            "Ticket handoff manquant. Retournez sur TIP et rouvrez « Admin GuideHub ».",
          );
          return;
        }

        if (history.replaceState) {
          history.replaceState(null, "", location.pathname);
        }

        function persistSession(accessToken, email, role, memberRole) {
          try {
            localStorage.removeItem("traumatec_access_token");
          } catch (e) {
            /* ignore */
          }
          try {
            sessionStorage.removeItem("traumatec_access_token");
          } catch (e) {
            /* ignore */
          }
          localStorage.setItem("traumatec_access_token", accessToken);
          sessionStorage.setItem(
            "traumatec_auth_verified",
            JSON.stringify({
              role: role,
              email: email || "sso@tip",
              memberRole: memberRole || "Administrateur",
              at: Date.now(),
            }),
          );
        }

        function verifySession(accessToken) {
          return fetch(ghApi + "/auth/me", {
            method: "GET",
            headers: { Authorization: "Bearer " + accessToken },
            credentials: "same-origin",
            cache: "no-store",
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("Session GuideHub refusée.");
              }
              return response.json();
            })
            .then(function (body) {
              if (!body || !body.success || !body.data) {
                throw new Error("Profil GuideHub invalide.");
              }
              persistSession(
                accessToken,
                body.data.email,
                body.data.role,
                body.data.memberRole,
              );
            });
        }

        status.textContent = "Récupération sécurisée de la session…";

        fetch(location.origin + "/api/v1/guides/handoff/consume", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          cache: "no-store",
          body: JSON.stringify({ ticket: ticket }),
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Ticket expiré ou déjà utilisé.");
            }
            return response.json();
          })
          .then(function (data) {
            if (!data || !data.access_token) {
              throw new Error("Réponse handoff invalide.");
            }
            return verifySession(data.access_token).then(function () {
              return data;
            });
          })
          .then(function (data) {
            try {
              sessionStorage.removeItem("tip:guides:handoff:ticket");
              sessionStorage.removeItem("tip:guides:handoff:company_slug");
            } catch (e) {
              /* ignore */
            }
            var redirect = data.redirect || "/gh/admin";
            if (redirect === "/admin") redirect = "/gh/admin";
            var adminPath = redirect.startsWith("/") ? redirect : "/" + redirect;
            manualTarget =
              redirect.startsWith("http://") || redirect.startsWith("https://")
                ? redirect
                : guidesWeb + adminPath;
            setManualLink(
              manualTarget,
              "Redirection vers l'administration GuideHub…",
            );
            setTimeout(function () {
              location.replace(manualTarget);
            }, 120);
          })
          .catch(function (err) {
            showError(
              err && err.message
                ? err.message
                : "Handoff impossible. Relancez depuis TIP.",
            );
          });
      })();
    </script>
  </body>
</html>
