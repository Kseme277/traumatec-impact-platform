<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection GuideHub | Traumatec</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #4a8df8;
        --bg: #222222;
        --bg-break: #222222;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--accent);
        font-family: "Raleway", system-ui, sans-serif;
        font-weight: 100;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      h1 {
        margin: 0 0 2.5rem;
        color: var(--accent);
        font-family: "Raleway", system-ui, sans-serif;
        font-weight: 100;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.15;
      }

      .slider {
        position: relative;
        width: min(400px, 88vw);
        height: 2px;
        margin: 0 auto 2.5rem;
      }

      .line {
        position: absolute;
        inset: 0;
        background: var(--accent);
        height: 2px;
      }

      .break {
        position: absolute;
        top: 0;
        background: var(--bg-break);
        width: 6px;
        height: 2px;
        animation: loading 2s infinite;
      }

      .dot2 {
        animation-delay: 0.5s;
      }

      .dot3 {
        animation-delay: 1s;
      }

      @keyframes loading {
        from {
          left: 0;
        }
        to {
          left: 100%;
        }
      }

      .message {
        margin: 0;
        max-width: 28rem;
        font-size: 1rem;
        line-height: 1.7;
        font-weight: 100;
        color: var(--accent);
      }

      .message.is-error {
        color: #f97066;
      }

      .message a {
        color: var(--accent);
        font-weight: 400;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .message a:hover {
        opacity: 0.85;
      }

      .meta {
        margin-top: 2.5rem;
        font-size: 0.8125rem;
        opacity: 0.55;
      }

      .meta a {
        color: var(--accent);
        text-decoration: none;
      }

      .meta a:hover {
        text-decoration: underline;
      }

      .meta p {
        margin: 0 0 0.5rem;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">GuideHub · Traumatec</p>
      <h1 id="title">Un instant…</h1>

      <div class="slider" id="slider" aria-hidden="true">
        <div class="line"></div>
        <div class="break dot1"></div>
        <div class="break dot2"></div>
        <div class="break dot3"></div>
      </div>

      <p class="message" id="status" role="status" aria-live="polite">
        Redirection vers votre espace administrateur GuideHub…
      </p>

      <div class="meta" id="metaLinks" hidden>
        <p>Ressources :</p>
        <div class="links">
          <a id="guidesLink" href="#" target="_blank" rel="noopener noreferrer">Guides procédures</a>
          <a id="apiDocsLink" href="#" target="_blank" rel="noopener noreferrer">Documentation API</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var DEFAULT_API_GATEWAY = "https://guidehub.hopto.org";
        var DEFAULT_COMPANY_SLUG = "traumatec-cm";

        var params = new URLSearchParams(location.search);
        var ticket = params.get("ticket");
        var companySlug = params.get("company_slug") || DEFAULT_COMPANY_SLUG;
        var guidesWeb = location.origin.replace(/\/$/, "");
        var apiGateway = DEFAULT_API_GATEWAY.replace(/\/$/, "");

        var title = document.getElementById("title");
        var status = document.getElementById("status");
        var slider = document.getElementById("slider");
        var metaLinks = document.getElementById("metaLinks");
        var guidesLink = document.getElementById("guidesLink");
        var apiDocsLink = document.getElementById("apiDocsLink");
        var manualTarget = guidesWeb + "/admin";

        guidesLink.href = guidesWeb + "/" + companySlug;
        apiDocsLink.href = apiGateway + "/api/docs";
        metaLinks.hidden = false;

        function setManualLink(href, label) {
          status.innerHTML =
            label +
            ' Pas de redirection ? <a href="' +
            href +
            '">Cliquez ici.</a>';
        }

        function showError(message) {
          title.textContent = "Connexion impossible";
          slider.hidden = true;
          status.classList.add("is-error");
          status.textContent = message;
        }

        if (!ticket) {
          showError(
            "Ticket handoff manquant. Retournez sur TIP et rouvrez « Admin GuideHub ».",
          );
          return;
        }

        if (history.replaceState) {
          history.replaceState(null, "", location.pathname);
        }

        function persistSession(accessToken, email, role) {
          try {
            localStorage.removeItem("traumatec_access_token");
          } catch (e) {
            /* ignore */
          }
          sessionStorage.setItem("traumatec_access_token", accessToken);
          sessionStorage.setItem(
            "traumatec_auth_verified",
            JSON.stringify({ role: role, email: email || "sso@tip", at: Date.now() }),
          );
        }

        status.textContent = "Récupération sécurisée de la session…";

        fetch(location.origin + "/api/v1/guides/handoff/consume", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          cache: "no-store",
          body: JSON.stringify({ ticket: ticket }),
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Ticket expiré ou déjà utilisé.");
            }
            return response.json();
          })
          .then(function (data) {
            if (!data || !data.access_token) {
              throw new Error("Réponse handoff invalide.");
            }
            persistSession(data.access_token, data.email, data.role);
            var redirect = data.redirect || "/admin";
            var adminPath = redirect.startsWith("/") ? redirect : "/" + redirect;
            manualTarget =
              redirect.startsWith("http://") || redirect.startsWith("https://")
                ? redirect
                : guidesWeb + adminPath;
            setManualLink(
              manualTarget,
              "Redirection vers l'administration GuideHub…",
            );
            setTimeout(function () {
              location.replace(manualTarget);
            }, 120);
          })
          .catch(function (err) {
            showError(
              err && err.message
                ? err.message
                : "Handoff impossible. Relancez depuis TIP.",
            );
          });
      })();
    </script>
  </body>
</html>
