events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Résolution DNS Docker au runtime (évite l'échec au boot si un service n'est pas encore prêt)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream tip_identity {
        zone tip_identity 64k;
        server identity:8001 resolve;
    }

    upstream tip_events {
        zone tip_events 64k;
        server events:8002 resolve;
    }

    upstream tip_catalog {
        zone tip_catalog 64k;
        server catalog:8003 resolve;
    }

    upstream tip_docgen {
        zone tip_docgen 64k;
        server docgen:8004 resolve;
    }

    upstream tip_frontend {
        zone tip_frontend 64k;
        server frontend:5173 resolve;
    }

    # GuideHub (traumatec-guide-evens) — hôte réseau entreprise
    upstream guidehub_web {
        server 192.168.1.45:3100;
    }

    upstream guidehub_api {
        server 192.168.1.45:3080;
    }

    server {
        listen 80;
        server_name _;

        # --- API Gateway : routage par préfixe / module ---

        # --- Identity : auth Clerk & gestion utilisateurs ---

        location ~ ^/api/admin(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/users(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/webhooks(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/auth(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/users(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/audit(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/guides(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/events(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/imports(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location ~ ^/api/v1/participants(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/templates(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/certificate-sets(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/packages(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 200m;
        }

        location ~ ^/api/v1/profiles(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/parcours(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/generations(/|$) {
            proxy_pass         http://tip_docgen;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Clerk Frontend API (proxy same-origin pour éviter les erreurs CORS en dev)
        location /__clerk/ {
            proxy_pass         https://humane-deer-24.clerk.accounts.dev/;
            proxy_ssl_server_name on;
            proxy_set_header   Host humane-deer-24.clerk.accounts.dev;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health agrégé (chaque service expose /health)
        location = /health/identity {
            proxy_pass http://tip_identity/health;
        }
        location = /health/events {
            proxy_pass http://tip_events/health;
        }
        location = /health/catalog {
            proxy_pass http://tip_catalog/health;
        }
        location = /health/docgen {
            proxy_pass http://tip_docgen/health;
        }

        location / {
            proxy_pass         http://tip_frontend;
            proxy_set_header   Host $host;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # --- Proxy GuideHub (TIP uniquement) : SSO admin JWT + catalogue sur même origine ---
    # GUIDES_UPSTREAM_WEB / GUIDES_UPSTREAM_API pointent vers traumatec-guide-evens (192.168.1.45)
    server {
        listen 3101;
        server_name _;

        location = /guidehub-handoff.html {
            alias /var/www/guidehub-handoff.html;
            default_type text/html;
        }

        location /api/v1/ {
            proxy_pass         http://guidehub_api/api/v1/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://guidehub_web/;
            proxy_set_header   Host 192.168.1.45:3100;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_set_header   Accept-Encoding "";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     http://192.168.1.45:3100/ http://$http_host/;
            proxy_redirect     http://localhost/ http://$http_host/;
            proxy_redirect     http://127.0.0.1/ http://$http_host/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            # Admin JWT : empêche le handshake Clerk satellite (redirect localhost:80/admin)
            sub_filter_once    off;
            sub_filter '<head>' '<head><script>(function(){var p=location.pathname;if(p.indexOf("/admin")!==0&&p.indexOf("/superadmin")!==0)return;function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
        }
    }
}
