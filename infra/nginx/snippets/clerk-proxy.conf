# Proxy Clerk Frontend API — IPv4 only (EC2 sans IPv6 : sinon timeouts / spinner infini).
# Utilise une variable + resolver ipv6=off pour éviter les tentatives AAAA.

resolver 127.0.0.11 valid=10s ipv6=off;

set $clerk_backend "humane-deer-24.clerk.accounts.dev";
rewrite ^/__clerk/(.*)$ /$1 break;
proxy_pass https://$clerk_backend;
proxy_ssl_server_name on;
proxy_set_header Host humane-deer-24.clerk.accounts.dev;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
