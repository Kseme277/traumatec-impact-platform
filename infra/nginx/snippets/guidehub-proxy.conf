# GuideHub via TIP — même origine HTTPS (/gh/*) + page handoff
location = /guidehub-handoff.html {
    alias /var/www/guidehub-handoff.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}

location ^~ /gh/api/v1/ {
    proxy_pass         https://guidehub_api/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ^~ /gh/ {
    rewrite ^/gh/?(.*)$ /$1 break;
    proxy_pass         https://guidehub_web;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Forwarded-Port $server_port;
    proxy_set_header   X-Forwarded-Prefix /gh;
    proxy_set_header   Accept-Encoding "";
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     https://guidehub.hopto.org/ $scheme://$host/gh/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    sub_filter_once    off;
    sub_filter '<head>' '<head><script>(function(){var p=location.pathname;if(p.indexOf("/gh/admin")!==0&&p.indexOf("/gh/superadmin")!==0)return;try{var q=new URLSearchParams(location.search);var tip=q.get("tip_token");if(tip){localStorage.setItem("traumatec_access_token",tip);sessionStorage.setItem("traumatec_auth_verified",JSON.stringify({role:q.get("tip_role")||"admin_company",email:q.get("tip_email")||"sso@tip",memberRole:q.get("tip_member_role")||"Administrateur",at:Date.now()}));["tip_token","tip_role","tip_email","tip_member_role"].forEach(function(k){q.delete(k);});var qs=q.toString();history.replaceState({},"",location.pathname+(qs?"?"+qs:""));}var st=sessionStorage.getItem("traumatec_access_token");if(st&&!localStorage.getItem("traumatec_access_token")){localStorage.setItem("traumatec_access_token",st);sessionStorage.removeItem("traumatec_access_token");}}catch(e){}function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
}
