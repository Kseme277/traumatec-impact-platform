# GuideHub via TIP — même origine HTTPS (/gh/*) + page handoff

# GuideHub SPA navigue vers /admin (racine) — renvoyer vers le proxy same-origin
location = /admin {
    return 302 /gh/admin;
}

location = /superadmin {
    return 302 /gh/superadmin;
}

location = /guidehub-handoff.html {
    alias /var/www/guidehub-handoff.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}

# Next.js + assets GuideHub (chemins absolus /_next/* hors préfixe /gh/)
location ^~ /_next/ {
    proxy_pass         https://guidehub_web/_next/;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location = /guidehub-icon.svg {
    proxy_pass         https://guidehub_web/guidehub-icon.svg;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
}

location = /manifest.webmanifest {
    proxy_pass         https://guidehub_web/manifest.webmanifest;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
}

location ^~ /gh/api/v1/ {
    proxy_pass         https://guidehub_api/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ^~ /gh/ {
    rewrite ^/gh/?(.*)$ /$1 break;
    proxy_pass         https://guidehub_web;
    proxy_ssl_server_name on;
    proxy_set_header   Host guidehub.hopto.org;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Forwarded-Port $server_port;
    proxy_set_header   X-Forwarded-Prefix /gh;
    proxy_set_header   Accept-Encoding "";
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     https://guidehub.hopto.org/ $scheme://$host/gh/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    sub_filter_once    off;
    sub_filter_types   text/html text/css application/javascript application/json;
    sub_filter 'https://guidehub.hopto.org' '$scheme://$host/gh';
    sub_filter 'http://guidehub.hopto.org' '$scheme://$host/gh';
    sub_filter '"/api/v1/' '"/gh/api/v1/';
    sub_filter "'/api/v1/" "'/gh/api/v1/";
    sub_filter '"/admin' '"/gh/admin';
    sub_filter "'/admin" "'/gh/admin";
    sub_filter '"/_next/' '"/gh/_next/';
    sub_filter "'/_next/" "'/gh/_next/";
    sub_filter '<head>' '<head><script>(function(){var GH="/gh";function fix(u){if(typeof u!=="string")return u;if(u==="/admin"||u.indexOf("/admin/")===0)return GH+u;if(u==="/superadmin"||u.indexOf("/superadmin/")===0)return GH+u;return u;}["pushState","replaceState"].forEach(function(m){var o=history[m];history[m]=function(s,t,u){return o.call(this,s,t,fix(u));};});var p=location.pathname;if(p==="/admin"||p==="/superadmin"){location.replace(GH+p+location.search+location.hash);return;}var isGhAdmin=p.indexOf("/gh/admin")===0||p.indexOf("/gh/superadmin")===0;if(!isGhAdmin)return;try{var q=new URLSearchParams(location.search);var tip=q.get("tip_token");if(tip){localStorage.setItem("traumatec_access_token",tip);sessionStorage.setItem("traumatec_auth_verified",JSON.stringify({role:q.get("tip_role")||"admin_company",email:q.get("tip_email")||"sso@tip",memberRole:q.get("tip_member_role")||"Administrateur",at:Date.now()}));["tip_token","tip_role","tip_email","tip_member_role"].forEach(function(k){q.delete(k);});var qs=q.toString();history.replaceState({},"",location.pathname+(qs?"?"+qs:""));}var st=sessionStorage.getItem("traumatec_access_token");if(st&&!localStorage.getItem("traumatec_access_token")){localStorage.setItem("traumatec_access_token",st);sessionStorage.removeItem("traumatec_access_token");}}catch(e){}function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
}
