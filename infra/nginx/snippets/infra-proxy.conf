# Observabilité — https://tip-platform.hopto.org/infra/*
# Auth basique limitée à ces locations (ne pas mettre auth_basic hors location).

location = /infra {
    return 301 /infra/;
}

location /infra/grafana/ {
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /infra/prometheus/ {
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    rewrite ^/infra/prometheus/?(.*)$ /$1 break;
    proxy_pass http://tip_prometheus;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /infra/minio/ {
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_minio_console/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
}

location /infra/cadvisor/ {
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_cadvisor/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
