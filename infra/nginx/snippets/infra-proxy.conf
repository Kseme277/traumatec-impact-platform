# Observabilité et stockage — accès via https://tip-platform.hopto.org/infra/*
# Protégé par authentification HTTP basique (fichier .htpasswd-infra).

auth_basic "TIP Infrastructure";
auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;

location = /infra {
    return 301 /infra/;
}

location /infra/grafana/ {
    proxy_pass http://tip_grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /infra/prometheus/ {
    proxy_pass http://tip_prometheus/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /infra/minio/ {
    proxy_pass http://tip_minio_console/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
}

location /infra/cadvisor/ {
    proxy_pass http://tip_cadvisor/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
