# Observabilité — https://tip-platform.hopto.org/infra/*
# Auth basique limitée à ces locations uniquement.

location = /infra {
    return 301 /infra/;
}

location = /grafana {
    return 302 /infra/grafana/;
}

location = /prometheus {
    return 302 /infra/prometheus/;
}

location = /graph {
    return 302 /infra/prometheus/graph;
}

location = /minio {
    return 302 /infra/minio/;
}

location /infra/grafana/ {
    include /etc/nginx/snippets/security-headers-infra.conf;
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
}

location /infra/prometheus/ {
    include /etc/nginx/snippets/security-headers-infra.conf;
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_prometheus/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location /infra/minio/ {
    include /etc/nginx/snippets/security-headers-infra.conf;
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    rewrite ^/infra/minio/(.*) /$1 break;
    proxy_pass http://tip_minio_console;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy "true";
    real_ip_header X-Real-IP;
    proxy_connect_timeout 300;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_redirect off;
}

location /infra/cadvisor/ {
    include /etc/nginx/snippets/security-headers-infra.conf;
    auth_basic "TIP Infrastructure";
    auth_basic_user_file /etc/nginx/snippets/.htpasswd-infra;
    proxy_pass http://tip_cadvisor/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
