# En-têtes de sécurité TIP (HTTP — sans HSTS)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Content-Security-Policy "default-src 'self' http://18.212.130.169; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://18.212.130.169 https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' http://18.212.130.169 https://fonts.googleapis.com; font-src 'self' http://18.212.130.169 https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http://18.212.130.169; connect-src 'self' http://18.212.130.169 https://*.clerk.accounts.dev https://*.clerk.com https://guidehub.hopto.org wss: ws:; frame-src 'self' http://18.212.130.169 https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src blob: 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

proxy_hide_header X-Powered-By;
proxy_hide_header Server;
