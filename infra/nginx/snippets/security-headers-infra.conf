# En-têtes pour consoles infra (Grafana, Prometheus, MinIO, cAdvisor).
# Remplace les en-têtes TIP du bloc server pour ces locations uniquement.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: https://unpkg.com; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https: http: wss: ws: https://unpkg.com; frame-src 'self' https:; worker-src blob: 'self';" always;
