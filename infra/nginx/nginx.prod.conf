events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream tip_identity {
        zone tip_identity 64k;
        server identity:8001 resolve;
    }

    upstream tip_events {
        zone tip_events 64k;
        server events:8002 resolve;
    }

    upstream tip_catalog {
        zone tip_catalog 64k;
        server catalog:8003 resolve;
    }

    upstream tip_docgen {
        zone tip_docgen 64k;
        server docgen:8004 resolve;
    }

    upstream tip_analytics {
        zone tip_analytics 64k;
        server analytics:8005 resolve;
    }

    upstream tip_frontend {
        zone tip_frontend 64k;
        server frontend:80 resolve;
    }

    upstream tip_onlyoffice {
        zone tip_onlyoffice 64k;
        server onlyoffice:80 resolve;
    }

    upstream guidehub_web {
        zone guidehub_web 64k;
        server guidehub.hopto.org:443 resolve;
    }

    upstream guidehub_api {
        zone guidehub_api 64k;
        server guidehub.hopto.org:443 resolve;
    }

    server {
        listen 80;
        server_name tip-platform.hopto.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://tip-platform.hopto.org$request_uri;
        }
    }

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/snippets/security-headers.conf;

        location ~ ^/api/admin(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/users(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
