    server {
        listen 3101 ssl;
        http2 on;
        server_name tip-platform.hopto.org;

        ssl_certificate     /etc/letsencrypt/live/tip-platform.hopto.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tip-platform.hopto.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        include /etc/nginx/snippets/security-headers-https.conf;

        location = /guidehub-handoff.html {
            alias /var/www/guidehub-handoff.html;
            default_type text/html;
        }

        location = /api/v1/guides/handoff/consume {
            proxy_pass         http://tip_identity/api/v1/guides/handoff/consume;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass         https://guidehub_api/api/v1/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         https://guidehub_web/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_set_header   Accept-Encoding "";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     https://guidehub.hopto.org/ https://$http_host/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            sub_filter_once    off;
            sub_filter '<head>' '<head><script>(function(){var path=location.pathname;var isAdmin=path.indexOf("/admin")===0||path.indexOf("/superadmin")===0;if(!isAdmin)return;try{var p=new URLSearchParams(location.search);var tip=p.get("tip_token");if(tip){localStorage.setItem("traumatec_access_token",tip);sessionStorage.setItem("traumatec_auth_verified",JSON.stringify({role:p.get("tip_role")||"admin_company",email:p.get("tip_email")||"sso@tip",memberRole:p.get("tip_member_role")||"Administrateur",at:Date.now()}));["tip_token","tip_role","tip_email","tip_member_role"].forEach(function(k){p.delete(k);});var qs=p.toString();history.replaceState({},"",location.pathname+(qs?"?"+qs:""));}var st=sessionStorage.getItem("traumatec_access_token");if(st&&!localStorage.getItem("traumatec_access_token")){localStorage.setItem("traumatec_access_token",st);sessionStorage.removeItem("traumatec_access_token");}}catch(e){}function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
        }
    }

    # Rétrocompatibilité handoff GuideHub via IP (HTTP)
    server {
        listen 3101;
        server_name _;

        include /etc/nginx/snippets/security-headers.conf;

        location = /guidehub-handoff.html {
            alias /var/www/guidehub-handoff.html;
            default_type text/html;
        }

        location = /api/v1/guides/handoff/consume {
            proxy_pass         http://tip_identity/api/v1/guides/handoff/consume;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass         https://guidehub_api/api/v1/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         https://guidehub_web/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_set_header   Accept-Encoding "";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     https://guidehub.hopto.org/ http://$http_host/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            sub_filter_once    off;
            sub_filter '<head>' '<head><script>(function(){var path=location.pathname;var isAdmin=path.indexOf("/admin")===0||path.indexOf("/superadmin")===0;if(!isAdmin)return;try{var p=new URLSearchParams(location.search);var tip=p.get("tip_token");if(tip){localStorage.setItem("traumatec_access_token",tip);sessionStorage.setItem("traumatec_auth_verified",JSON.stringify({role:p.get("tip_role")||"admin_company",email:p.get("tip_email")||"sso@tip",memberRole:p.get("tip_member_role")||"Administrateur",at:Date.now()}));["tip_token","tip_role","tip_email","tip_member_role"].forEach(function(k){p.delete(k);});var qs=p.toString();history.replaceState({},"",location.pathname+(qs?"?"+qs:""));}var st=sessionStorage.getItem("traumatec_access_token");if(st&&!localStorage.getItem("traumatec_access_token")){localStorage.setItem("traumatec_access_token",st);sessionStorage.removeItem("traumatec_access_token");}}catch(e){}function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
        }
    }
