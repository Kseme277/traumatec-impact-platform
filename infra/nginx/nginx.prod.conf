events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream tip_identity {
        zone tip_identity 64k;
        server identity:8001 resolve;
    }

    upstream tip_events {
        zone tip_events 64k;
        server events:8002 resolve;
    }

    upstream tip_catalog {
        zone tip_catalog 64k;
        server catalog:8003 resolve;
    }

    upstream tip_docgen {
        zone tip_docgen 64k;
        server docgen:8004 resolve;
    }

    upstream tip_analytics {
        zone tip_analytics 64k;
        server analytics:8005 resolve;
    }

    upstream tip_frontend {
        zone tip_frontend 64k;
        server frontend:80 resolve;
    }

    upstream tip_onlyoffice {
        zone tip_onlyoffice 64k;
        server onlyoffice:80 resolve;
    }

    upstream guidehub_web {
        zone guidehub_web 64k;
        server guidehub.hopto.org:443 resolve;
    }

    upstream guidehub_api {
        zone guidehub_api 64k;
        server guidehub.hopto.org:443 resolve;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location ~ ^/api/admin(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/users(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/webhooks(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/auth(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/users(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/audit(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/guides(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/notifications(/|$) {
            proxy_pass         http://tip_identity;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/events(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/imports(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location ~ ^/api/v1/participants(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/assistant(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/v1/teachers(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/national-contacts(/|$) {
            proxy_pass         http://tip_events;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/templates(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/certificate-sets(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/packages(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 200m;
        }

        location ~ ^/api/v1/profiles(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/parcours(/|$) {
            proxy_pass         http://tip_catalog;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/generations(/|$) {
            proxy_pass         http://tip_docgen;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/v1/workflow(/|$) {
            proxy_pass         http://tip_docgen;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/v1/certificates(/|$) {
            proxy_pass         http://tip_docgen;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/v1/analytics(/|$) {
            proxy_pass         http://tip_analytics;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /__clerk/ {
            proxy_pass         https://humane-deer-24.clerk.accounts.dev/;
            proxy_ssl_server_name on;
            proxy_set_header   Host humane-deer-24.clerk.accounts.dev;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /onlyoffice/ {
            proxy_pass         http://tip_onlyoffice/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            client_max_body_size 200m;
        }

        location = /health/identity {
            proxy_pass http://tip_identity/health;
        }
        location = /health/events {
            proxy_pass http://tip_events/health;
        }
        location = /health/catalog {
            proxy_pass http://tip_catalog/health;
        }
        location = /health/docgen {
            proxy_pass http://tip_docgen/health;
        }
        location = /health/analytics {
            proxy_pass http://tip_analytics/health;
        }

        location / {
            proxy_pass         http://tip_frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 3101;
        server_name _;

        location = /guidehub-handoff.html {
            alias /var/www/guidehub-handoff.html;
            default_type text/html;
        }

        location = /api/v1/guides/handoff/consume {
            proxy_pass         http://tip_identity/api/v1/guides/handoff/consume;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass         https://guidehub_api/api/v1/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         https://guidehub_web/;
            proxy_ssl_server_name on;
            proxy_set_header   Host guidehub.hopto.org;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_set_header   Accept-Encoding "";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     https://guidehub.hopto.org/ http://$http_host/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            sub_filter_once    off;
            sub_filter '<head>' '<head><script>(function(){var p=location.pathname;if(p.indexOf("/admin")!==0&&p.indexOf("/superadmin")!==0)return;function block(){document.querySelectorAll("script[data-clerk-js-script]").forEach(function(s){s.remove();});}block();new MutationObserver(block).observe(document.documentElement,{childList:true,subtree:true});})();</script>';
        }
    }
}
